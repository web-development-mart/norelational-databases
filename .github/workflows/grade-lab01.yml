name: Grade Lab 01

on:
  push:
    paths:
      - "backend/seed.js"
      - "backend/grading/grade.js"
      - ".github/workflows/grade-lab01.yml"
  pull_request:
    paths:
      - "backend/seed.js"

jobs:
  grade:
    name: Milestone 1
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package.json

      - name: Install dependencies
        working-directory: backend
        run: npm install

      - name: Run student solution
        working-directory: backend
        env:
          MONGODB_URI: mongodb://localhost:27017
        run: node seed.js

      - name: Run grader
        working-directory: backend
        env:
          MONGODB_URI: mongodb://localhost:27017
        run: node grading/grade.js

      - name: Read grade result
        id: grade-result
        if: always()
        run: |
          if [ -f backend/grading/result.json ]; then
            echo "passed=$(node -p "require('./backend/grading/result.json').passed")" >> $GITHUB_OUTPUT
            echo "failed=$(node -p "require('./backend/grading/result.json').failed")" >> $GITHUB_OUTPUT
            echo "total=$(node -p "require('./backend/grading/result.json').total")" >> $GITHUB_OUTPUT
          else
            echo "passed=0" >> $GITHUB_OUTPUT
            echo "failed=0" >> $GITHUB_OUTPUT
            echo "total=0" >> $GITHUB_OUTPUT
          fi

      - name: Notify Google Sheet
        if: always()
        run: |
          curl -X POST "${{ secrets.SHEETS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"repo\": \"${{ github.repository }}\",
              \"student\": \"${{ github.actor }}\",
              \"tag\": \"${{ github.ref_name }}\",
              \"status\": \"${{ job.status }}\",
              \"milestone\": \"1\",
              \"passed\": \"${{ steps.grade-result.outputs.passed }}\",
              \"failed\": \"${{ steps.grade-result.outputs.failed }}\",
              \"total\": \"${{ steps.grade-result.outputs.total }}\",
              \"run_url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
            }"
