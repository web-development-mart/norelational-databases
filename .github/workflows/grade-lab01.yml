name: Grade Lab 01

on:
  push:

jobs:
  grade:
    name: Milestone 3
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: backend/package.json

      - name: Install dependencies
        working-directory: backend
        run: npm install

      - name: Seed database
        working-directory: backend
        env:
          MONGODB_URI: mongodb://localhost:27017/blog_db
        run: node seed.js

      - name: Run Playwright tests
        working-directory: backend
        env:
          MONGODB_URI: mongodb://localhost:27017/blog_db
          CI: "true"
        run: npx playwright test
        continue-on-error: true

      - name: Read results
        id: results
        if: always()
        run: |
          if [ -f backend/grading/results.json ]; then
            PASSED=$(node -p "require('./backend/grading/results.json').stats.expected")
            FAILED=$(node -p "require('./backend/grading/results.json').stats.unexpected")
            TOTAL=$(node -p "require('./backend/grading/results.json').stats.expected + require('./backend/grading/results.json').stats.unexpected")
          else
            PASSED=0; FAILED=0; TOTAL=0
          fi
          echo "passed=$PASSED" >> $GITHUB_OUTPUT
          echo "failed=$FAILED" >> $GITHUB_OUTPUT
          echo "total=$TOTAL"   >> $GITHUB_OUTPUT

      - name: Job summary
        if: always()
        run: |
          echo "## Milestone 3 - REST API" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| | Count |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| ✅ Passed | ${{ steps.results.outputs.passed }} |" >> $GITHUB_STEP_SUMMARY
          echo "| ❌ Failed | ${{ steps.results.outputs.failed }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "[View full report (HTML artifact)](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})" >> $GITHUB_STEP_SUMMARY

      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: backend/grading/report/
          retention-days: 30

      - name: Notify Google Sheet
        if: always()
        run: |
          curl -L -X POST "${{ secrets.SHEETS_WEBHOOK_URL }}" \
            -H "Content-Type: application/json" \
            -d "{
              \"repo\":      \"${{ github.repository }}\",
              \"student\":   \"${{ github.actor }}\",
              \"tag\":       \"${{ github.ref_name }}\",
              \"status\":    \"${{ job.status }}\",
              \"milestone\": \"3\",
              \"passed\":    \"${{ steps.results.outputs.passed }}\",
              \"failed\":    \"${{ steps.results.outputs.failed }}\",
              \"total\":     \"${{ steps.results.outputs.total }}\",
              \"run_url\":   \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
            }" \
            -w "\nHTTP %{http_code}\n"
