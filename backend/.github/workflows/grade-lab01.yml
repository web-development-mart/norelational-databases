name: Grade Lab 01

on:
  push:
    paths:
      - "backend/seed.js"
      - "backend/grading/grade.js"
      - "backend/.github/workflows/grade-lab01.yml"
  pull_request:
    paths:
      - "backend/seed.js"

jobs:
  grade:
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package.json

      - name: Install dependencies
        working-directory: backend
        run: npm install

      - name: Run student solution
        working-directory: backend
        env:
          MONGODB_URI: mongodb://localhost:27017
        run: node seed.js

      - name: Run grader
        working-directory: backend
        env:
          MONGODB_URI: mongodb://localhost:27017
        run: node grading/grade.js
