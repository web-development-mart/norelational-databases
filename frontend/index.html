<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab 01 - Users</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="section">
      <div class="section-header">
        <h2>All Users</h2>
        <span class="route-label">GET /users</span>
      </div>
      <div class="grid" id="users"></div>
    </div>

    <div class="section">
      <div class="section-header">
        <h2>All Posts</h2>
        <span class="route-label">GET /posts</span>
        <button class="btn btn-new" id="new-post-btn">+ New post</button>
      </div>
      <div class="grid" id="posts"></div>
    </div>

    <div class="modal-overlay" id="modal-overlay">
      <div class="modal" id="modal">
        <button class="modal-close" id="modal-close">&times;</button>
        <div class="modal-content" id="modal-content"></div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
