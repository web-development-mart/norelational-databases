<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lab 01 - Users</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="section">
      <div class="section-header">
        <h2>All Users</h2>
        <span class="route-label">GET /users</span>
      </div>
      <div class="grid" id="users"></div>
    </div>

    <div class="section">
      <div class="section-header">
        <h2>Users from France</h2>
        <span class="route-label">GET /users/from-france</span>
      </div>
      <div class="grid" id="users-france"></div>
    </div>

    <div class="section">
      <div class="section-header">
        <h2>Users with Skills</h2>
        <span class="route-label">GET /users/skilled</span>
      </div>
      <div class="grid" id="users-skilled"></div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
